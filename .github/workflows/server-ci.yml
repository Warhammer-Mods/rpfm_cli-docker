name: RPFM Server Docker
on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the server image (without publishing)
        uses: docker/build-push-action@v6
        with:
          context: server
          load: true
          push: false
          tags: local/rpfm-server:5.1.1
          cache-from: type=gha,scope=rpfm-server
          cache-to: type=gha,mode=max,scope=rpfm-server
      - name: Start RPFM for this job
        id: rpfm
        uses: ./server
        with:
          image: local/rpfm-server:5.1.1
      - name: Run MCP smoke test
        run: |
          python3 server/smoke_test.py
      - name: Container logs and cleanup
        if: always()
        env:
          RPFM_CONTAINER: ${{ steps.rpfm.outputs.container }}
        run: |
          if [[ -n "${RPFM_CONTAINER}" ]]; then
            docker logs "${RPFM_CONTAINER}" || true
            docker rm --force "${RPFM_CONTAINER}" || true
          fi
